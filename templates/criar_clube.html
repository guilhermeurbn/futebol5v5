{% extends 'base.html' %}

{% block title %}Criar Novo Clube — NaTrave 5v5{% endblock %}

{% block content %}
<div class="criar-clube-page-wrapper" style="background: radial-gradient(circle at 50% 10%, rgba(34, 197, 94, 0.12), transparent 60%), #000000; min-height: 100vh; width: 100%; color: #ffffff; padding: 2rem 1rem clamp(6rem, 10vh, 9rem) 1rem;">
    <div style="max-width: 580px; margin: 0 auto;">
        
        <!-- Voltar e Header -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
            <a href="javascript:history.back()" style="display: inline-flex; align-items: center; gap: 0.4rem; color: #22c55e; font-weight: 800; font-size: 0.85rem; text-decoration: none; background: rgba(34, 197, 94, 0.1); padding: 0.4rem 0.85rem; border-radius: 999px; border: 1px solid rgba(34, 197, 94, 0.28);">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Voltar</span>
            </a>
            <span style="font-size: 0.78rem; font-weight: 800; color: #94a3b8; letter-spacing: 0.05em; text-transform: uppercase;">Novo Clube</span>
        </div>

        <!-- Hero Card Form -->
        <div style="background: rgba(18, 18, 23, 0.95); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 24px; padding: 2.2rem 1.8rem; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px);">
            
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(16, 185, 129, 0.1)); border: 1px solid rgba(34, 197, 94, 0.4); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; color: #22c55e;">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <h1 style="font-size: 1.6rem; font-weight: 900; color: #ffffff; margin: 0 0 0.4rem 0; letter-spacing: -0.02em;">Criar Novo NaTrave</h1>
                <p style="font-size: 0.88rem; color: #94a3b8; margin: 0; line-height: 1.5;">Cadastre seu clube de futebol 5v5 com nome único, sorteio equilibrado e estatísticas completas.</p>
            </div>

            <form id="formCriarClube" onsubmit="submeterCriacaoClube(event)" style="display: grid; gap: 1.5rem;">
                
                <!-- Campo Nome do Clube com Validação AJAX em tempo real -->
                <div>
                    <label for="nomeClube" style="display: block; font-size: 0.76rem; font-weight: 850; color: #ffffff; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem;">Nome do Clube</label>
                    <div style="position: relative;">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); pointer-events: none;">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        <input type="text" id="nomeClube" name="nome" placeholder="Ex: Pelada dos Amigos, Real Resenha FC" required minlength="2" maxlength="60" oninput="validarNomeClubeTempoReal(this.value)" style="width: 100%; padding: 0.88rem 1rem 0.88rem 2.8rem; background: rgba(255, 255, 255, 0.055); border: 1.5px solid rgba(255, 255, 255, 0.16); border-radius: 14px; color: #ffffff; font-size: 0.98rem; font-weight: 700; outline: none; transition: all 0.2s ease;">
                        <div id="validacaoStatusIcon" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); display: none;"></div>
                    </div>
                    <div id="validacaoFeedback" style="font-size: 0.8rem; font-weight: 700; margin-top: 0.45rem; min-height: 1.2rem;"></div>
                </div>

                <!-- Campo Frequência dos Jogos -->
                <div>
                    <label for="frequenciaJogos" style="display: block; font-size: 0.76rem; font-weight: 850; color: #ffffff; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem;">Frequência dos Jogos</label>
                    <div style="position: relative;">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); pointer-events: none;">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <input type="text" id="frequenciaJogos" name="frequencia_jogos" value="Semanal" placeholder="Ex: Semanal, Quintas às 20h, Sábados" style="width: 100%; padding: 0.88rem 1rem 0.88rem 2.8rem; background: rgba(255, 255, 255, 0.055); border: 1.5px solid rgba(255, 255, 255, 0.16); border-radius: 14px; color: #ffffff; font-size: 0.98rem; font-weight: 700; outline: none; transition: all 0.2s ease;">
                    </div>
                </div>

                <!-- Escudo ou Imagem do Clube (Opcional) -->
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label style="font-size: 0.76rem; font-weight: 850; color: #ffffff; text-transform: uppercase; letter-spacing: 0.06em; margin: 0;">Escudo / Logo do Clube</label>
                        <button type="button" id="btnToggleFotoPage" onclick="toggleModoFotoPage()" class="mc-shield-toggle-pill">
                            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <span>Foto própria</span>
                        </button>
                    </div>

                    <!-- Grade de Escudos Heráldicos da Imagem 2 -->
                    <div id="seletorEscudosPageWrap">
                        <div class="mc-shields-grid" id="criarClubePageShieldsGrid" style="grid-template-columns: repeat(4, 1fr); gap: 0.55rem;"></div>
                        <input type="hidden" id="escudoIdClubePage" name="escudo_id" value="classico">
                    </div>

                    <!-- Modo Upload Imagem Customizada -->
                    <div id="uploadFotoPageWrap" style="display: none; align-items: center; gap: 0.85rem; background: rgba(255, 255, 255, 0.04); border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 14px; padding: 0.85rem;">
                        <div id="previewFotoClubePage" style="width: 52px; height: 52px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </div>
                        <div style="flex: 1;">
                            <input type="file" id="inputFotoClubePage" accept="image/png, image/jpeg, image/webp" style="display: none;" onchange="previewUploadFotoClubePage(this)">
                            <button type="button" onclick="document.getElementById('inputFotoClubePage').click()" style="width: 100%; padding: 0.65rem 0.9rem; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 12px; color: #cbd5e1; font-size: 0.85rem; font-weight: 700; cursor: pointer;">
                                Escolher Imagem
                            </button>
                            <input type="hidden" id="fotoUrlClubePage">
                        </div>
                    </div>
                </div>

                <!-- Seletor de Tema de Cores -->
                <div>
                    <label style="display: block; font-size: 0.78rem; font-weight: 850; color: #ffffff; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem;">Cor Tema do Clube</label>
                    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.6rem;">
                        <label class="color-option" style="cursor: pointer; text-align: center;">
                            <input type="radio" name="cor_tema" value="neon-green" checked style="display: none;" onchange="atualizarSeletorCor(this)">
                            <div style="height: 44px; border-radius: 12px; background: #22c55e; border: 2px solid #ffffff; transition: all 0.2s ease; box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);"></div>
                            <span style="font-size: 0.7rem; font-weight: 700; color: #94a3b8; display: block; margin-top: 0.3rem;">Verde</span>
                        </label>
                        <label class="color-option" style="cursor: pointer; text-align: center;">
                            <input type="radio" name="cor_tema" value="electric-blue" style="display: none;" onchange="atualizarSeletorCor(this)">
                            <div style="height: 44px; border-radius: 12px; background: #3b82f6; border: 2px solid transparent; opacity: 0.7; transition: all 0.2s ease;"></div>
                            <span style="font-size: 0.7rem; font-weight: 700; color: #94a3b8; display: block; margin-top: 0.3rem;">Azul</span>
                        </label>
                        <label class="color-option" style="cursor: pointer; text-align: center;">
                            <input type="radio" name="cor_tema" value="sunset-purple" style="display: none;" onchange="atualizarSeletorCor(this)">
                            <div style="height: 44px; border-radius: 12px; background: #a855f7; border: 2px solid transparent; opacity: 0.7; transition: all 0.2s ease;"></div>
                            <span style="font-size: 0.7rem; font-weight: 700; color: #94a3b8; display: block; margin-top: 0.3rem;">Roxo</span>
                        </label>
                        <label class="color-option" style="cursor: pointer; text-align: center;">
                            <input type="radio" name="cor_tema" value="gold-ember" style="display: none;" onchange="atualizarSeletorCor(this)">
                            <div style="height: 44px; border-radius: 12px; background: #eab308; border: 2px solid transparent; opacity: 0.7; transition: all 0.2s ease;"></div>
                            <span style="font-size: 0.7rem; font-weight: 700; color: #94a3b8; display: block; margin-top: 0.3rem;">Dourado</span>
                        </label>
                        <label class="color-option" style="cursor: pointer; text-align: center;">
                            <input type="radio" name="cor_tema" value="crimson-red" style="display: none;" onchange="atualizarSeletorCor(this)">
                            <div style="height: 44px; border-radius: 12px; background: #ef4444; border: 2px solid transparent; opacity: 0.7; transition: all 0.2s ease;"></div>
                            <span style="font-size: 0.7rem; font-weight: 700; color: #94a3b8; display: block; margin-top: 0.3rem;">Vermelho</span>
                        </label>
                    </div>
                </div>

                <!-- Botão de Criação -->
                <button type="submit" id="btnSubmitCriarClube" style="width: 100%; padding: 0.95rem; background: linear-gradient(135deg, #22c55e, #16a34a); border: none; border-radius: 14px; color: #000000; font-size: 1rem; font-weight: 900; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); margin-top: 0.5rem;">
                    Criar Clube NaTrave
                </button>
            </form>
        </div>
    </div>
</div>

<script>
let timerDebounce = null;
let nomeValido = false;

function validarNomeClubeTempoReal(val) {
    clearTimeout(timerDebounce);
    const feedback = document.getElementById('validacaoFeedback');
    const iconWrap = document.getElementById('validacaoStatusIcon');
    const input = document.getElementById('nomeClube');

    if (!val || val.trim().length < 2) {
        feedback.textContent = 'Digite pelo menos 2 caracteres.';
        feedback.style.color = '#94a3b8';
        iconWrap.style.display = 'none';
        input.style.borderColor = 'rgba(255, 255, 255, 0.15)';
        nomeValido = false;
        return;
    }

    timerDebounce = setTimeout(async () => {
        try {
            const resp = await fetch('/api/clube/validar-nome', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome: val.trim() })
            });
            const data = await resp.json();

            if (data.disponivel) {
                feedback.textContent = '✓ ' + data.mensagem;
                feedback.style.color = '#22c55e';
                input.style.borderColor = '#22c55e';
                iconWrap.innerHTML = '✨';
                iconWrap.style.display = 'block';
                nomeValido = true;
            } else {
                feedback.textContent = '⚠️ ' + data.mensagem;
                feedback.style.color = '#ef4444';
                input.style.borderColor = '#ef4444';
                iconWrap.innerHTML = '❌';
                iconWrap.style.display = 'block';
                nomeValido = false;
            }
        } catch (e) {
            console.error('Erro na validação:', e);
        }
    }, 300);
}

function atualizarSeletorCor(radio) {
    document.querySelectorAll('.color-option div').forEach(el => {
        el.style.border = '2px solid transparent';
        el.style.opacity = '0.7';
        el.style.boxShadow = 'none';
    });
    const parentBox = radio.nextElementSibling;
    if (parentBox) {
        parentBox.style.border = '2px solid #ffffff';
        parentBox.style.opacity = '1';
        parentBox.style.boxShadow = '0 0 12px ' + parentBox.style.backgroundColor;
    }
}

function toggleModoFotoPage() {
    const escudosWrap = document.getElementById('seletorEscudosPageWrap');
    const uploadWrap = document.getElementById('uploadFotoPageWrap');
    const btnToggle = document.getElementById('btnToggleFotoPage');
    if (!escudosWrap || !uploadWrap) return;

    if (uploadWrap.style.display === 'none' || getComputedStyle(uploadWrap).display === 'none') {
        uploadWrap.style.display = 'flex';
        escudosWrap.style.display = 'none';
        if (btnToggle) btnToggle.textContent = '🛡️ Usar catálogo de escudos';
    } else {
        uploadWrap.style.display = 'none';
        escudosWrap.style.display = 'block';
        if (btnToggle) btnToggle.textContent = '+ Ou foto própria';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    if (window.renderizarSeletorEscudos) {
        window.renderizarSeletorEscudos('criarClubePageShieldsGrid', 'escudoIdClubePage', 'classico');
    }
});

async function previewUploadFotoClubePage(input) {
    if (!input || !input.files || !input.files[0]) return;
    const file = input.files[0];
    const preview = document.getElementById('previewFotoClubePage');
    const hiddenUrl = document.getElementById('fotoUrlClubePage');

    const reader = new FileReader();
    reader.onload = e => {
        if (preview) preview.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: 100%; object-fit: cover;">`;
    };
    reader.readAsDataURL(file);

    const fd = new FormData();
    fd.append('foto', file);
    try {
        const resp = await fetch('/api/clube/upload-foto', { method: 'POST', body: fd });
        const data = await resp.json();
        if (data.sucesso && data.foto_url) {
            hiddenUrl.value = data.foto_url;
        }
    } catch (e) {
        console.error('Erro upload foto:', e);
    }
}

async function submeterCriacaoClube(event) {
    event.preventDefault();
    const nome = document.getElementById('nomeClube').value.trim();
    const corTema = document.querySelector('input[name="cor_tema"]:checked')?.value || 'neon-green';
    const frequencia = document.getElementById('frequenciaJogos')?.value.trim() || 'Semanal';
    const fotoUrl = document.getElementById('fotoUrlClubePage')?.value.trim() || null;
    const escudoId = document.getElementById('escudoIdClubePage')?.value.trim() || 'classico';
    const btn = document.getElementById('btnSubmitCriarClube');

    if (!nomeValido && nome.length < 2) {
        alert('Por favor, digite um nome válido e disponível para seu clube.');
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Criando Clube...';

    try {
        const resp = await fetch('/api/clube/criar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                nome: nome,
                cor_tema: corTema,
                frequencia_jogos: frequencia,
                foto_url: fotoUrl,
                escudo_id: escudoId
            })
        });
        const data = await resp.json();

        if (data.sucesso) {
            window.location.href = data.redirect_url || '/';
        } else {
            alert('Erro: ' + (data.mensagem || 'Não foi possível criar o clube.'));
            btn.disabled = false;
            btn.textContent = 'Criar Clube NaTrave';
        }
    } catch (e) {
        alert('Erro ao conectar com o servidor. Tente novamente.');
        btn.disabled = false;
        btn.textContent = 'Criar Clube NaTrave';
    }
}
</script>
<script src="{{ url_for('static', filename='app-onboarding.js', v='20260919-02') }}"></script>
{% endblock %}
