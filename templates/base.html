<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7c3aed">
    <meta name="description" content="NaTrave - Aplicação profissional para sorteio balanceado de times em partidas de futebol 5v5">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%237c3aed;stop-opacity:1' /><stop offset='55%' style='stop-color:%23ec4899;stop-opacity:1' /><stop offset='100%' style='stop-color:%2306b6d4;stop-opacity:1' /></linearGradient></defs><rect fill='url(%23g)' width='180' height='180' rx='44'/><circle cx='90' cy='78' r='48' fill='rgba(255,255,255,0.12)'/><path d='M61 106V60l29 29 29-29v46' fill='none' stroke='white' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/><rect x='53' y='114' width='74' height='20' rx='10' fill='rgba(255,255,255,0.22)'/><text x='90' y='128' dominant-baseline='middle' text-anchor='middle' font-size='17' font-weight='700' fill='white' font-family='Arial'>5v5</text></svg>">
    <title>NaTrave | {% block title %}Painel{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260616-06') }}">
    <script src="{{ url_for('static', filename='local-datetime.js', v='20260616-06') }}" defer></script>
    <script src="{{ url_for('static', filename='app-shell-navigation.js', v='20260704-07') }}" defer></script>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body class="app-shell {% block body_class %}{% endblock %}">
    <script src="{{ url_for('static', filename='offline-judge.js') }}"></script>
    <script>
        // Inject CSRF token into all POST forms automatically (works with Flask-WTF CSRFProtect)
        (function () {
            function ensureCsrfToken(root) {
                try {
                    const token = "{{ csrf_token() }}";
                    if (!token) return;

                    const scope = root instanceof Element ? root : document;
                    scope.querySelectorAll('form[method="post"]').forEach(function (f) {
                        if (!f.querySelector('input[name="csrf_token"]')) {
                            const i = document.createElement('input');
                            i.type = 'hidden';
                            i.name = 'csrf_token';
                            i.value = token;
                            f.prepend(i);
                        }
                    });
                } catch (e) {
                    console.warn('CSRF auto-inject skipped');
                }
            }

            window.NaTraveCSRF = Object.assign({}, window.NaTraveCSRF, {
                ensureFormTokens: ensureCsrfToken
            });

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function () {
                    ensureCsrfToken(document);
                });
            } else {
                ensureCsrfToken(document);
            }
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const serviceWorkerUrl = '/static/service-worker.js?v=20260616-06';
                navigator.serviceWorker.register(serviceWorkerUrl, { updateViaCache: 'none' })
                    .then(registration => {
                        registration.update().catch(() => {});
                        if (registration.waiting) {
                            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                        }
                    })
                    .catch(error => console.warn('[PWA] Erro ao registrar Service Worker:', error));

                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    window.location.reload();
                });
            });
        }
    </script>

    <script>
        (function () {
            let teardownSwipe = null;

            function normalizePath(href) {
                try {
                    return new URL(href, window.location.origin).pathname;
                } catch (error) {
                    return href;
                }
            }

            function setupMobileDockAndSwipe() {
                if (typeof teardownSwipe === 'function') {
                    teardownSwipe();
                    teardownSwipe = null;
                }

                const navTabs = document.querySelector('.nav-tabs');
                if (!navTabs) return;

                const tabs = Array.from(navTabs.querySelectorAll('.nav-tab[href]'));
                if (tabs.length < 2) return;

                const isMobile = window.matchMedia('(max-width: 700px)').matches;
                if (!isMobile) return;

                document.body.classList.add('has-mobile-dock');
                navTabs.style.gridTemplateColumns = 'repeat(' + tabs.length + ', minmax(0, 1fr))';

                let startX = 0;
                let startY = 0;
                let startTime = 0;
                let lastDx = 0;
                let tracking = false;
                let rafId = 0;
                const listeners = [];

                function currentTabIndex() {
                    const activeTab = navTabs.querySelector('.nav-tab.active');
                    if (activeTab) {
                        const activeIndex = tabs.indexOf(activeTab);
                        if (activeIndex >= 0) return activeIndex;
                    }

                    const currentPath = normalizePath(window.location.pathname);
                    const matchedIndex = tabs.findIndex((tab) => normalizePath(tab.href) === currentPath);
                    return matchedIndex >= 0 ? matchedIndex : 0;
                }

                function navigateByOffset(offset) {
                    const nextIndex = currentTabIndex() + offset;
                    if (nextIndex < 0 || nextIndex >= tabs.length) return;
                    const nextTab = tabs[nextIndex];
                    if (nextTab) {
                        const appShellNav = window.NaTraveAppShellNav;
                        if (appShellNav && typeof appShellNav.navigateTo === 'function') {
                            appShellNav.navigateTo(nextTab.href);
                        } else {
                            window.location.href = nextTab.href;
                        }
                    }
                }

                function applySwipePreview(dx) {
                    const maxTranslate = Math.min(window.innerWidth * 0.18, 72);
                    const dampedDx = Math.max(Math.min(dx, maxTranslate), -maxTranslate);
                    const progress = Math.min(Math.abs(dampedDx) / maxTranslate, 1);
                    const previewDirection = Math.sign(dampedDx);

                    document.body.classList.add('is-swipe-preview');
                    document.body.style.setProperty('--swipe-offset', dampedDx.toFixed(2) + 'px');
                    document.body.style.setProperty('--swipe-progress', progress.toFixed(3));
                    document.body.style.setProperty('--swipe-direction', String(previewDirection || 0));
                }

                function clearSwipePreview() {
                    document.body.classList.remove('is-swipe-preview');
                    document.body.style.removeProperty('--swipe-offset');
                    document.body.style.removeProperty('--swipe-progress');
                    document.body.style.removeProperty('--swipe-direction');
                }

                const onTouchStart = function (event) {
                    const target = event.target;
                    if (target instanceof Element && target.closest('a, button, input, textarea, select, label, [role="button"], .votacao-slider, .logout-form, .logout-form-auto')) {
                        tracking = false;
                        clearSwipePreview();
                        return;
                    }

                    if (event.touches.length !== 1) return;
                    tracking = true;
                    startX = event.touches[0].clientX;
                    startY = event.touches[0].clientY;
                    startTime = Date.now();
                    lastDx = 0;
                };

                const onTouchMove = function (event) {
                    if (!tracking || event.touches.length !== 1) return;
                    const touch = event.touches[0];
                    const dx = touch.clientX - startX;
                    const dy = touch.clientY - startY;

                    if (Math.abs(dx) < 18 || Math.abs(dx) <= Math.abs(dy)) return;

                    lastDx = dx;
                    if (rafId) return;

                    rafId = window.requestAnimationFrame(function () {
                        applySwipePreview(lastDx * 0.45);
                        rafId = 0;
                    });
                };

                const onTouchEnd = function (event) {
                    if (!tracking) return;

                    const touch = event.changedTouches[0];
                    if (!touch) return;

                    const dx = touch.clientX - startX;
                    const dy = touch.clientY - startY;
                    const elapsed = Date.now() - startTime;

                    tracking = false;
                    if (rafId) {
                        window.cancelAnimationFrame(rafId);
                        rafId = 0;
                    }
                    clearSwipePreview();

                    if (elapsed > 700) return;
                    if (Math.abs(dx) < 60) return;
                    if (Math.abs(dx) <= Math.abs(dy) * 1.2) return;

                    if (dx > 0) {
                        navigateByOffset(-1);
                    } else {
                        navigateByOffset(1);
                    }
                };

                document.addEventListener('touchstart', onTouchStart, { passive: true });
                document.addEventListener('touchmove', onTouchMove, { passive: true });
                document.addEventListener('touchend', onTouchEnd, { passive: true });

                listeners.push(['touchstart', onTouchStart]);
                listeners.push(['touchmove', onTouchMove]);
                listeners.push(['touchend', onTouchEnd]);

                teardownSwipe = function () {
                    if (rafId) {
                        window.cancelAnimationFrame(rafId);
                        rafId = 0;
                    }
                    clearSwipePreview();
                    listeners.forEach(function (entry) {
                        document.removeEventListener(entry[0], entry[1]);
                    });
                };
            }

            window.NaTraveMobileNav = Object.assign({}, window.NaTraveMobileNav, {
                refresh: setupMobileDockAndSwipe
            });

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setupMobileDockAndSwipe);
            } else {
                setupMobileDockAndSwipe();
            }
        })();
    </script>

    {% if notificacoes_url %}
    <a href="{{ notificacoes_url }}" class="admin-notification-fab" aria-label="Abrir avisos do sistema">
        <span class="admin-notification-fab__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
                <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5" />
                <path d="M9.8 20a2.4 2.4 0 0 0 4.4 0" />
            </svg>
        </span>
        <span class="admin-notification-fab__count">{{ total_notificacoes }}</span>
    </a>
    {% endif %}
    {% if votacao_pendente and votacao_pendente_url %}
    <aside class="player-vote-notification" role="status" aria-live="polite" data-vote-notification data-vote-notification-id="{{ votacao_pendente.id }}">
        <span class="player-vote-notification__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5" />
                <path d="M9.8 20a2.4 2.4 0 0 0 4.4 0" />
            </svg>
        </span>
        <span class="player-vote-notification__copy">
            <strong>Votação aberta</strong>
            <span>{{ votacao_pendente.titulo or 'Sua partida já pode ser avaliada' }}</span>
        </span>
        <a href="{{ votacao_pendente_url }}" class="player-vote-notification__action">Minha votação</a>
        <button type="button" class="player-vote-notification__dismiss" data-vote-notification-dismiss aria-label="Fechar aviso de votação">×</button>
    </aside>
    <script>
        (function () {
            const toast = document.querySelector('[data-vote-notification]');
            if (!toast) return;

            let startX = 0;
            let currentX = 0;
            let dragging = false;
            let dismissed = false;

            function closeToast() {
                if (dismissed) return;
                dismissed = true;
                toast.classList.add('player-vote-notification--closing');
                window.setTimeout(function () {
                    toast.remove();
                }, 220);
            }

            window.setTimeout(function () {
                closeToast();
            }, 5000);

            const dismissButton = toast.querySelector('[data-vote-notification-dismiss]');
            if (dismissButton) {
                dismissButton.addEventListener('click', function () {
                    closeToast();
                });
            }

            toast.addEventListener('pointerdown', function (event) {
                if (event.target.closest('a, button')) return;
                dragging = true;
                startX = event.clientX;
                currentX = 0;
                toast.setPointerCapture(event.pointerId);
                toast.classList.add('player-vote-notification--dragging');
            });

            toast.addEventListener('pointermove', function (event) {
                if (!dragging) return;
                currentX = event.clientX - startX;
                toast.style.transform = 'translateX(' + currentX + 'px)';
            });

            function finishDrag() {
                if (!dragging) return;
                dragging = false;
                toast.classList.remove('player-vote-notification--dragging');
                if (Math.abs(currentX) > 90) {
                    closeToast();
                    return;
                }
                toast.style.transform = '';
            }

            toast.addEventListener('pointerup', finishDrag);
            toast.addEventListener('pointercancel', finishDrag);
        })();
    </script>
    {% endif %}
    <div id="app-content" data-app-content>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
