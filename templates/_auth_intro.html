<div class="auth-panel__brand auth-panel__brand--hero auth-panel__brand--hero-lockup">
    <div class="auth-panel__logo auth-panel__logo--image auth-panel__logo--hero auth-panel__logo--hero-large">
        <img src="{{ url_for('static', filename='logo-natrave-5v5.png') }}" alt="NaTrave 5v5" class="auth-panel__logo-image">
    </div>
    <div class="auth-panel__brand-copy auth-panel__brand-copy--hero">
        <h1 class="auth-title auth-title--hero-lockup">
            <span class="auth-title__line">
                Organize seu <span class="auth-title__accent">Futebol</span>
            </span>
            <span class="auth-title__line">
                de forma <span class="auth-title__accent">Equilibrada</span>
            </span>
        </h1>
    </div>
</div>

<div class="auth-preview-grid" aria-label="Prévia do que você encontra após entrar">
    <article class="auth-preview-card auth-preview-card--timers">
        <div class="auth-preview-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h16" />
                <path d="M4 17h16" />
                <path d="M7 7v10" />
                <path d="M17 7v10" />
            </svg>
        </div>
        <p class="auth-preview-card__label">Times equilibrados</p>
        <p class="auth-preview-card__text">Balanceamento preciso para partidas mais justas.</p>
    </article>
    <article class="auth-preview-card auth-preview-card--ranking">
        <div class="auth-preview-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 19V9" />
                <path d="M12 19V5" />
                <path d="M19 19v-8" />
            </svg>
        </div>
        <p class="auth-preview-card__label">Ranking</p>
        <p class="auth-preview-card__text">Evolução clara de desempenho e posição.</p>
    </article>
    <article class="auth-preview-card auth-preview-card--votacoes">
        <div class="auth-preview-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 12h10" />
                <path d="M12 7v10" />
                <path d="M5 5h14v14H5z" />
            </svg>
        </div>
        <p class="auth-preview-card__label">Votações</p>
        <p class="auth-preview-card__text">Participação rápida e simples após cada jogo.</p>
    </article>
    <article class="auth-preview-card auth-preview-card--management">
        <div class="auth-preview-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h16" />
                <path d="M4 12h10" />
                <path d="M4 17h13" />
                <path d="M18 12l2 2 3-3" />
            </svg>
        </div>
        <p class="auth-preview-card__label">Gestão completa</p>
        <p class="auth-preview-card__text">Organização centralizada de jogos e jogadores.</p>
    </article>
</div>
