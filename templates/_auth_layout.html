<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaTrave | {% block title %}Auth{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260616-06') }}">
    <script src="{{ url_for('static', filename='local-datetime.js', v='20260616-06') }}" defer></script>
</head>
<body class="auth-page {% block body_class %}{% endblock %}">
    <header class="auth-global-header" role="banner" aria-label="NaTrave">
        <a href="{{ url_for('auth.login_page') }}" aria-label="Ir para login" style="display:inline-block; line-height:0;">
            <img src="{{ url_for('static', filename='natrave.svg', v='20260708-03') }}" alt="NaTrave 5v5" class="auth-global-header__logo">
        </a>
    </header>

    <div class="auth-page__glow auth-page__glow--primary"></div>
    <div class="auth-page__glow auth-page__glow--secondary"></div>
    <div class="auth-page__glow auth-page__glow--accent"></div>

    <main class="auth-shell {% block auth_shell_class %}{% endblock %}">
        {% block auth_intro_wrapper %}{% endblock %}

        <section class="auth-panel auth-panel--form {% block auth_form_panel_class %}{% endblock %}" id="loginFormPanel" aria-labelledby="{% block auth_heading_id %}authHeading{% endblock %}">
            {% block auth_messages %}{% endblock %}
            {% block auth_card_header %}{% endblock %}
            {% block auth_form %}{% endblock %}
            {% block auth_card_footer %}{% endblock %}
        </section>
    </main>

    <footer class="auth-global-footer" role="contentinfo" aria-label="Rodapé do NaTrave">
        <span>NaTrave 5v5</span>
        <small>Experiência mobile estabilizada</small>
    </footer>

    {% block auth_scripts %}{% endblock %}
    <script>
        (function () {
            if (!document.body.classList.contains('auth-page--login')) return;

            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }

            window.addEventListener('pageshow', function () {
                if (window.location.hash === '#loginFormPanel') {
                    history.replaceState(null, '', window.location.pathname + window.location.search);
                }
                requestAnimationFrame(function () {
                    window.scrollTo(0, 0);
                });
            });

            const indicador = document.querySelector('.auth-scroll-hint');
            const formulario = document.getElementById('loginFormPanel');
            if (indicador && formulario) {
                indicador.addEventListener('click', function () {
                    formulario.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                });
                window.setTimeout(function () {
                    indicador.classList.add('is-hidden');
                }, 1500);
            }
        })();
    </script>
</body>
</html>
