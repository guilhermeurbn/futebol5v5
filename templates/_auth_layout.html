<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7c3aed">
    <meta name="description" content="{% block meta_description %}Acesse a plataforma NaTrave 5v5 para gerenciar suas partidas e sortear times equilibrados.{% endblock %}">

    <link rel="canonical" href="{{ request.url | replace(request.host_url, 'https://natrave.com.br/') }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.url | replace(request.host_url, 'https://natrave.com.br/') }}">
    <meta property="og:title" content="NaTrave | {% block og_title %}{{ self.title() }}{% endblock %}">
    <meta property="og:description" content="{{ self.meta_description() }}">
    <meta property="og:image" content="https://natrave.com.br/apple-touch-icon.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ request.url | replace(request.host_url, 'https://natrave.com.br/') }}">
    <meta name="twitter:title" content="NaTrave | {{ self.title() }}">
    <meta name="twitter:description" content="{{ self.meta_description() }}">
    <meta name="twitter:image" content="https://natrave.com.br/apple-touch-icon.png">

    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <title>NaTrave | {% block title %}Acesso{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260616-06') }}">
    <script src="{{ url_for('static', filename='local-datetime.js', v='20260616-06') }}" defer></script>
</head>
<body class="auth-page {% block body_class %}{% endblock %}">
    <header class="auth-global-header" role="banner" aria-label="NaTrave">
        <a href="{{ url_for('auth.login_page') }}" aria-label="Ir para login" style="display:inline-block; line-height:0;">
            <img src="{{ url_for('static', filename='logo-natrave-5v5.png', v='20260717-01') }}" alt="NaTrave 5v5" class="auth-global-header__logo" style="max-height: 48px; width: auto; object-fit: contain;">
        </a>
    </header>

    <div class="auth-page__glow auth-page__glow--primary"></div>
    <div class="auth-page__glow auth-page__glow--secondary"></div>
    <div class="auth-page__glow auth-page__glow--accent"></div>

    <main class="auth-shell {% block auth_shell_class %}{% endblock %}">
        {% block auth_intro_wrapper %}{% endblock %}

        <section class="auth-panel auth-panel--form {% block auth_form_panel_class %}{% endblock %}" id="loginFormPanel" aria-labelledby="{% block auth_heading_id %}authHeading{% endblock %}">
            {% block auth_messages %}{% endblock %}
            {% block auth_card_header %}{% endblock %}
            {% block auth_form %}{% endblock %}
            {% block auth_card_footer %}{% endblock %}
        </section>
    </main>

    {% block auth_scripts %}{% endblock %}
    <script>
        (function () {
            if (!document.body.classList.contains('auth-page--login')) return;

            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }

            window.addEventListener('pageshow', function () {
                if (window.location.hash === '#loginFormPanel') {
                    history.replaceState(null, '', window.location.pathname + window.location.search);
                }
                requestAnimationFrame(function () {
                    window.scrollTo(0, 0);
                });
            });

            const indicador = document.querySelector('.auth-scroll-hint');
            const formulario = document.getElementById('loginFormPanel');
            if (indicador && formulario) {
                indicador.addEventListener('click', function () {
                    formulario.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                });
                window.setTimeout(function () {
                    indicador.classList.add('is-hidden');
                }, 1500);
            }
        })();
    </script>
</body>
</html>
