<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NaTrave 5v5</title>
  <style>
    body {
      background-color: #121217;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .logo {
      width: 140px;
      height: auto;
      margin-bottom: 1.5rem;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(124, 58, 237, 0.2);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="logo-natrave-5v5.png" alt="NaTrave 5v5" class="logo">
  <div class="spinner"></div>
  <script>
    (function() {
      // Entry point para o aplicativo Capacitor no iOS
      const targetUrl = window.location.origin.includes('localhost') ? '/login' : 'https://natrave.pt/login';
      window.location.replace(targetUrl);
    })();
  </script>
</body>
</html>
